name: Uptime

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API, database and compiler
        run: |
          curl -fsS --max-time 20 --retry 2 --retry-delay 15 --retry-all-errors \
            https://api.rezumiq.com/health/deep
