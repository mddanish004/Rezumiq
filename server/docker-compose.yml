services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rezumiq
      POSTGRES_USER: rezumiq
      POSTGRES_PASSWORD: rezumiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezumiq -d rezumiq"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
